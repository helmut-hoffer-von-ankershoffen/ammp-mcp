name: CodeQL

# Static security analysis via GitHub's CodeQL engine. Findings show up at:
#   https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp/security/code-scanning
#
# Runs on every push/PR to main, plus a weekly schedule so a newly-published
# query pack still finds issues in unchanged code within ~7 days.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

env:
  # Opt every JavaScript action into Node 24 even when an action's
  # default runtime is still Node 20. Removes the deprecation warning
  # uniformly across actions; can be removed once every pinned action
  # ships its Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # SARIF upload to Code Scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Trim the default extraction set — we don't have native code,
          # docs build, or large vendor trees.
          paths: src/ammp_mcp

      - name: Autobuild
        uses: github/codeql-action/autobuild@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:${{ matrix.language }}"
