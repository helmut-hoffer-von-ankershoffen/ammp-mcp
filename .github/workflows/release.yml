name: Release

# Triggered on a `vX.Y.Z` (or pre-release `vX.Y.Z-rcN`) tag, e.g.:
#
#     git tag -a v0.3.0 -m "v0.3.0 — what changed"
#     git push origin v0.3.0
#
# The workflow:
#   1. verifies the git tag matches `pyproject.toml [project].version`
#      (a silent mismatch ships a mislabelled package; we fail fast instead)
#   2. classifies the tag as full-release vs. pre-release (`v*-*`)
#   3. runs the test suite once on Python 3.13 to refuse a release if main is red
#   4. builds the sdist + wheel, smoke-tests the wheel, generates SHA256 sums
#   5. attests build provenance via Sigstore (SLSA Level 3)
#   6. creates the GitHub Release with notes assembled from CHANGELOG.md +
#      auto-generated commit/PR list, attaches dist/* + SHA256SUMS, and marks
#      pre-release status correctly. GitHub Release runs *before* PyPI so
#      the artefacts are durably attached even if PyPI publishing later fails.
#   7. publishes to PyPI via OIDC trusted publishing. Requires the Trusted
#      Publisher to be configured on https://pypi.org/manage/account/publishing/.
#      If misconfigured, this step (and the workflow) fails hard — fix the
#      PyPI side, then re-run the workflow from the failed job.
#
# Reverting a release: delete the tag locally + on origin, delete the GH
# Release in the UI; you cannot un-publish a PyPI version (only yank it).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Opt every JavaScript action into Node 24 even when an action's
  # default runtime is still Node 20. Removes the deprecation warning
  # uniformly across actions; can be removed once every pinned action
  # ships its Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  # -----------------------------------------------------------------------
  preflight:
    name: Preflight (verify tag + classify)
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.derive.outputs.version }}     # "0.3.0" (no v prefix)
      tag:        ${{ steps.derive.outputs.tag }}         # "v0.3.0"
      prerelease: ${{ steps.derive.outputs.prerelease }}  # "true" | "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Derive version from tag and pyproject.toml
        id: derive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PYPROJECT_VERSION="$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")"
          if [[ "$VERSION" != "$PYPROJECT_VERSION" ]]; then
            echo "::error title=Tag/version mismatch::"\
                 "Git tag is $TAG (=> version $VERSION) but pyproject.toml "\
                 "[project].version is $PYPROJECT_VERSION. "\
                 "Bump pyproject.toml or retag, do not ship a mismatched build."
            exit 1
          fi
          # Pre-release iff the tag has a hyphen-separated suffix (PEP 440-ish).
          # v0.3.0       -> stable
          # v0.3.0-rc1   -> pre-release
          # v0.3.0a1     -> stable per this regex (intentional; PyPI itself
          #                 will treat 0.3.0a1 as a pre-release at index time)
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE"  >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG, version=$VERSION, prerelease=$PRERELEASE"

  # -----------------------------------------------------------------------
  test:
    name: Test on Python 3.13
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install (locked deps + pre-push hooks)
        run: make install

      - name: Lint + type-check + docstrings
        run: make lint

      - name: Tests (unit + integration with coverage)
        run: make test

  # -----------------------------------------------------------------------
  gates:
    name: Verify all required quality gates passed for this SHA
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Block release when Audit / SonarCloud / CodeQL / CI on this SHA is not green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          REPO="${GITHUB_REPOSITORY}"

          # Build the list of SHAs we'll accept gate runs from.
          # Primary: the tag commit itself ($SHA) — the natural and strictest case.
          # Fallback: tip of `main`, but only if it's a strict descendant of $SHA
          # AND the diff is limited to release-housekeeping files. This handles
          # the common case where a pre-push `uv.lock` sync commit becomes
          # main's new tip after the tag is pushed, so the branch-event
          # gate workflows fire on the descendant, not on $SHA.
          MAIN_HEAD="$(gh api "repos/${REPO}/branches/main" --jq .commit.sha)"
          VALIDATING_SHAS=("$SHA")
          if [[ "$MAIN_HEAD" != "$SHA" ]]; then
            COMPARE_JSON="$(gh api "repos/${REPO}/compare/${SHA}...${MAIN_HEAD}" 2>/dev/null || echo '{}')"
            REL_STATUS="$(echo "$COMPARE_JSON" | jq -r '.status // empty')"
            if [[ "$REL_STATUS" == "ahead" || "$REL_STATUS" == "identical" ]]; then
              OFFENDERS="$(echo "$COMPARE_JSON" \
                | jq -r '[.files[]?.filename] | map(select(test("^(uv\\.lock|CHANGELOG\\.md|src/[^/]+/__init__\\.py)$") | not)) | join(",")')"
              if [[ -z "$OFFENDERS" ]]; then
                echo "[gates] main head ${MAIN_HEAD:0:7} is a release-housekeeping descendant of ${SHA:0:7} — adding as fallback gate validator."
                VALIDATING_SHAS+=("$MAIN_HEAD")
              else
                echo "[gates] main head ${MAIN_HEAD:0:7} descends from ${SHA:0:7} but with non-housekeeping changes ($OFFENDERS) — fallback rejected; will only validate against $SHA."
              fi
            fi
          fi

          REQUIRED=(Audit SonarCloud CodeQL CI)
          FAIL=0
          for NAME in "${REQUIRED[@]}"; do
            GATE_OK=0
            FINAL_CONCLUSION=""
            FINAL_STATUS=""
            FINAL_VSHA=""
            for VSHA in "${VALIDATING_SHAS[@]}"; do
              # Poll: when a tag and a main push land near-simultaneously,
              # the gate workflow may still be running. Wait up to ~15 min
              # for it to finish before deciding. Short-circuit to the next
              # candidate SHA after ~1 min of "no run at all" if we have one,
              # since a workflow that hasn't started after a minute on the
              # primary SHA almost certainly won't (the branch-push event
              # fired on the descendant).
              NO_RUN_COUNT=0
              for attempt in $(seq 1 90); do
                CONCLUSION="$(gh api -X GET "repos/${REPO}/actions/runs" \
                    -f "head_sha=${VSHA}" -f "per_page=50" \
                    --jq ".workflow_runs[] | select(.name==\"${NAME}\") | .conclusion" \
                    | head -n1 || echo "")"
                STATUS="$(gh api -X GET "repos/${REPO}/actions/runs" \
                    -f "head_sha=${VSHA}" -f "per_page=50" \
                    --jq ".workflow_runs[] | select(.name==\"${NAME}\") | .status" \
                    | head -n1 || echo "")"
                if [[ -z "$STATUS" ]]; then
                  NO_RUN_COUNT=$((NO_RUN_COUNT+1))
                  if [[ $NO_RUN_COUNT -ge 6 && ${#VALIDATING_SHAS[@]} -gt 1 && "$VSHA" == "${VALIDATING_SHAS[0]}" ]]; then
                    echo "[$NAME @ ${VSHA:0:7}] no run after $NO_RUN_COUNT idle attempts — trying fallback validator."
                    break
                  fi
                  echo "[$NAME @ ${VSHA:0:7}] no run yet (attempt $attempt/90)…"
                  sleep 10
                  continue
                fi
                if [[ "$STATUS" == "in_progress" || "$STATUS" == "queued" || "$STATUS" == "waiting" || "$STATUS" == "pending" ]]; then
                  echo "[$NAME @ ${VSHA:0:7}] status='$STATUS' — waiting (attempt $attempt/90)…"
                  sleep 10
                  continue
                fi
                break
              done
              FINAL_CONCLUSION="$CONCLUSION"
              FINAL_STATUS="$STATUS"
              FINAL_VSHA="$VSHA"
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "[$NAME @ ${VSHA:0:7}] ✓ success"
                GATE_OK=1
                break
              fi
            done
            if [[ "$GATE_OK" != "1" ]]; then
              echo "::error title=Quality gate '$NAME' did not pass::"\
                   "Workflow '$NAME' on commit ${FINAL_VSHA:-$SHA} reported conclusion='${FINAL_CONCLUSION}' (status='${FINAL_STATUS}'). "\
                   "Fix the gate on main before tagging this release."
              FAIL=1
            fi
          done
          if [[ "$FAIL" != "0" ]]; then
            echo "::error::One or more required quality gates failed for $SHA. Release aborted."
            exit 1
          fi
          echo "All required quality gates green — proceeding with release."

  # -----------------------------------------------------------------------
  build:
    name: Build sdist + wheel
    needs: [preflight, test, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # for build-provenance attestations
      attestations: write   # for build-provenance attestations
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"

      - name: Build distributions + smoke-test the wheel
        run: make dist_smoke_test

      - name: Generate SHA256SUMS for dist/*
        working-directory: dist
        run: |
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance (SLSA / Sigstore)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # -----------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    needs: [preflight, build]   # Runs BEFORE publish-pypi so the artefacts
                                # are durably attached to the GH Release even
                                # if PyPI publishing later fails.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0       # `gh release create --generate-notes` needs full history

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md (if present)
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "no_changelog=true" >> "$GITHUB_OUTPUT"
            echo "(CHANGELOG.md not found — release notes will fall back to auto-generated commit list.)"
            exit 0
          fi
          # Pull the section under `## [X.Y.Z]` header until the next `## [` (or EOF).
          # Tag is `vX.Y.Z`; CHANGELOG header is `## [X.Y.Z]` (no `v`).
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ -s /tmp/release-notes.md ]]; then
            echo "no_changelog=false" >> "$GITHUB_OUTPUT"
            echo "Found CHANGELOG section for $VERSION:"
            head -20 /tmp/release-notes.md
          else
            echo "no_changelog=true" >> "$GITHUB_OUTPUT"
            echo "(no [$VERSION] section in CHANGELOG.md — falling back to auto-generated notes.)"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NO_CHANGELOG: ${{ steps.notes.outputs.no_changelog }}
        run: |
          set -euo pipefail
          ARGS=(
            "${GITHUB_REF_NAME}"
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "$NO_CHANGELOG" == "false" ]]; then
            ARGS+=(--notes-file /tmp/release-notes.md)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}" dist/*

  # -----------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI (OIDC; HARD FAIL if not configured)
    needs: github-release   # PyPI only after the GH Release is durable.
    runs-on: ubuntu-latest
    # PyPI trusted-publishing requires a one-time configuration at
    # https://pypi.org/manage/account/publishing/ . The job hard-fails if
    # misconfigured — fix PyPI, then re-run this job alone.
    environment:
      name: pypi
      url: https://pypi.org/p/ammp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Strip non-distributable files from dist/
        # PyPI publish rejects unknown files; SHA256SUMS would trip it up.
        run: |
          mv dist/SHA256SUMS .
          ls -la dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verify-metadata: true
          # `verify-tag` ensures the version inside the wheel matches the git tag.
          # Combined with the preflight check, this is belt-and-braces.
          verify-tag: true
