name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Python 3.14 is still in beta/RC at time of writing — mark its row
    # experimental so a 3.14-only regression (typically a transitive dep
    # not yet shipping wheels) doesn't fail the gate. The `experimental`
    # column is set per-include below.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        include:
          - python: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/ammp_mcp

      - name: Pytest (unit + integration)
        run: pytest -m "unit or integration" --cov=ammp_mcp --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml

      # Codecov upload — runs only on the canonical Python (3.13) so we don't
      # double-count coverage across the matrix. `slug` is required for the
      # action to associate the upload with the right project; without it the
      # badge sits empty even when uploads succeed elsewhere.
      - name: Upload coverage to Codecov
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v5
        with:
          slug: helmut-hoffer-von-ankershoffen/ammp-mcp
          files: reports/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results to Codecov
        if: matrix.python == '3.13' && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          slug: helmut-hoffer-von-ankershoffen/ammp-mcp
          files: reports/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
