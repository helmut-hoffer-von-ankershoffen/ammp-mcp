name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt every JavaScript action into Node 24 even when an action's
  # default runtime is still Node 20. Removes the deprecation warning
  # uniformly across actions; can be removed once every pinned action
  # ships its Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Every step delegates to the Makefile so the local-dev surface and CI
# stay byte-identical. No direct `uv …` or tool calls inside steps —
# `make help` is the single source of truth for what runs.

jobs:
  lint-and-test:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Python 3.14 is still in beta/RC at time of writing — mark its row
    # experimental so a 3.14-only regression (typically a transitive dep
    # not yet shipping wheels) doesn't fail the gate. The `experimental`
    # column is set per-include below.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        include:
          - python: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install (locked deps + pre-push hooks)
        run: make install

      - name: Lint + type-check + docstrings
        run: make lint

      - name: Tests (unit + integration with coverage)
        run: make test

      # Codecov upload — runs only on the canonical Python (3.13) so we don't
      # double-count coverage across the matrix. `slug` is required for the
      # action to associate the upload with the right project; without it the
      # badge sits empty even when uploads succeed elsewhere.
      - name: Upload coverage to Codecov
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          slug: helmut-hoffer-von-ankershoffen/ammp-mcp
          files: reports/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results to Codecov
        if: matrix.python == '3.13' && !cancelled()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          slug: helmut-hoffer-von-ankershoffen/ammp-mcp
          files: reports/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  docs-walk:
    # Haiku reads README/INSTALLATION/CLI_REFERENCE and exercises the
    # documented commands. Catches README drift (wrong default in an
    # env-var table, renamed subcommand, stale flag).
    #
    # On push-to-main and PRs from the owner repo, we WANT this gate to
    # actually run, so a missing ANTHROPIC_API_KEY secret fails the job
    # loudly with a remediation message. On PRs from forks (Dependabot
    # or external contributors), the secret is not visible by design —
    # the job emits a workflow notice and exits green.
    name: Docs walker (Haiku)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check ANTHROPIC_API_KEY secret is wired
        id: secret_check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Secret unset. On fork PRs that's by design; degrade gracefully.
          if [ -n "${PR_HEAD_REPO:-}" ] && [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::Docs walker self-skipped — secret is not visible to fork PRs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First-party push or PR: secret should be wired.
          echo "::error::ANTHROPIC_API_KEY repo secret is not set. Wire it: gh secret set ANTHROPIC_API_KEY --repo $REPO"
          {
            echo "## Docs walker — BLOCKED"
            echo ""
            echo "The \`ANTHROPIC_API_KEY\` repo secret is not configured, so the Haiku-driven doc walker cannot run."
            echo ""
            echo "**Fix:** \`gh secret set ANTHROPIC_API_KEY --repo $REPO\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: steps.secret_check.outputs.skip != 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install (locked deps + pre-push hooks)
        if: steps.secret_check.outputs.skip != 'true'
        run: make install

      - name: Run the doc walker
        if: steps.secret_check.outputs.skip != 'true'
        env:
          AMMP_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make docs_walk
