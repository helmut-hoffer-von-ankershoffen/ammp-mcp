name: SonarCloud

# Pushes test coverage + static-analysis findings to SonarCloud so the
# Quality Gate / Security / Maintainability / Coverage badges in
# README fill in. Requires:
#
#   1. Project provisioned at https://sonarcloud.io (org
#      "helmut-hoffer-von-ankershoffen", project key
#      "helmut-hoffer-von-ankershoffen_ammp-mcp"). Set up once.
#   2. `SONAR_TOKEN` repo secret. Generate at
#      https://sonarcloud.io/account/security and store with:
#        gh secret set SONAR_TOKEN --repo helmut-hoffer-von-ankershoffen/ammp-mcp
#
# Until both are configured, this workflow's runs will fail at the
# scan step (SonarSource/sonarqube-scan-action validates the token).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # Opt every JavaScript action into Node 24 even when an action's
  # default runtime is still Node 20. Removes the deprecation warning
  # uniformly across actions; can be removed once every pinned action
  # ships its Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Sonar's branch + PR analysis needs full history to compute
          # blame and new-code-period diffs.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate coverage + JUnit reports for Sonar
        run: |
          mkdir -p reports
          pytest -m "unit or integration" \
            --cov=ammp_mcp \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Fail the workflow if SonarCloud's Quality Gate is not OK. Without
      # this step the scan succeeds even when the gate fails — quietly
      # letting a regression land on main. Polls the gate result (the
      # scan writes its task token to `.scannerwork/report-task.txt`).
      - name: Enforce SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@d304d050a4ad4ffd0d4a08abdf5b5b08fb1665f6 # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
