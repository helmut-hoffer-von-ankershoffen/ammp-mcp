name: Audit

# Vulnerability + license + SBOM audit. Runs on:
#   - every push to main
#   - every pull request to main
#   - weekly (Mondays 06:00 UTC) so a new advisory against an unchanged
#     dependency still trips the gate within ~7 days
#   - manual dispatch (for ad-hoc checks)
#
# Tools wired in:
#   - pip-audit       — vulnerability scan against Python Advisory DB
#   - pip-licenses    — license compliance (allow-list enforced)
#   - cyclonedx-py    — CycloneDX SBOM (sbom.json)
#   - trivy           — additional vuln source + SPDX SBOM (sbom.spdx),
#                       SARIF uploaded to GitHub Code Scanning
#
# All results are uploaded as `audit-results` artefacts (30-day retention).
# The job fails on:
#   - pip-audit finding any non-ignored vulnerability
#   - pip-licenses finding a license outside the allow-list
#   - trivy finding a HIGH/CRITICAL vulnerability (SARIF upload still happens)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for trivy SARIF upload to Code Scanning

env:
  # Opt every JavaScript action into Node 24 even when an action's
  # default runtime is still Node 20. Removes the deprecation warning
  # uniformly across actions; can be removed once every pinned action
  # ships its Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    name: Vulnerabilities + licenses + SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + audit tools
        run: |
          python -m pip install --upgrade pip
          # Install the project so pip-audit and pip-licenses see real dep tree.
          pip install -e ".[dev]"
          pip install pip-audit pip-licenses cyclonedx-bom

      - name: Make reports/ directory
        run: mkdir -p reports

      # -- Vulnerability scan ----------------------------------------------
      # `--skip-editable` is required because `ammp-mcp` itself is installed
      # editable for testing — without skipping, pip-audit errors before it
      # even checks the dep tree. We can't use `--strict` for the same reason
      # (it treats any unaudited distribution, including the editable one,
      # as a failure). Instead, the post-check below fails the job if any
      # vulnerability was found.
      - name: Run pip-audit
        run: |
          pip-audit \
            --skip-editable \
            --format json \
            --output reports/vulnerabilities.json

      - name: Human-readable vulnerability summary
        if: always()
        run: pip-audit --skip-editable --format columns || true

      - name: Fail on any vulnerability
        run: |
          python <<'PY'
          import json, sys
          data = json.load(open("reports/vulnerabilities.json"))
          with_vulns = [d for d in data.get("dependencies", []) if d.get("vulns")]
          if with_vulns:
              print(f"::error::pip-audit found {len(with_vulns)} vulnerable dependencies:")
              for d in with_vulns:
                  ids = ", ".join(v["id"] for v in d["vulns"])
                  print(f"  - {d['name']} {d['version']}: {ids}")
              sys.exit(1)
          print("OK — no known vulnerabilities.")
          PY

      # -- License compliance ----------------------------------------------
      - name: Run pip-licenses
        run: |
          pip-licenses \
            --format=json \
            --with-urls \
            --with-license-file \
            --output-file=reports/licenses.json
          pip-licenses \
            --format=csv \
            --output-file=reports/licenses.csv

      - name: Enforce license allow-list
        # Permissive policy: MIT-style, BSD, Apache, MPL, ISC, PSF, public-domain
        # are all in. LGPL is allowed for *library* use (doesn't infect). GPL,
        # AGPL, SSPL, Commons-Clause are banned outright. For multi-license
        # offerings (e.g. "BSD; GPL; Public Domain") the dependency passes if
        # *any* of the offered licenses is in the allow-list — you'd pick that
        # one. UNKNOWN means pip-licenses couldn't read the metadata; we log
        # those (but don't fail) since most are packaging gaps, not policy
        # violations. Tighten this if the project ever becomes regulated.
        run: |
          python <<'PY'
          import json, sys
          ALLOWED = {
              "MIT License", "MIT",
              "BSD License", "BSD", "BSD-3-Clause", "BSD-2-Clause",
              "Apache Software License", "Apache 2.0", "Apache-2.0",
              "Mozilla Public License 2.0 (MPL 2.0)", "MPL-2.0",
              "ISC License (ISCL)", "ISC",
              "Python Software Foundation License", "PSF-2.0",
              "Public Domain", "The Unlicense (Unlicense)", "Unlicense",
              # LGPL — permissive for library use; not "viral" the way GPL is.
              "GNU Lesser General Public License v2 or later (LGPLv2+)",
              "GNU Lesser General Public License v3 or later (LGPLv3+)",
              "LGPL-2.1-or-later", "LGPL-3.0-or-later", "LGPL",
          }
          # GPL/AGPL/SSPL/Commons-Clause force the same licence downstream —
          # we cannot ship MIT if a transitive dep is GPL-only.
          BANNED = ("AGPL", "SSPL", "Commons Clause")
          rows = json.load(open("reports/licenses.json"))
          violations, unknowns = [], []
          for r in rows:
              lic = (r.get("License") or "").strip()
              if not lic or lic == "UNKNOWN":
                  unknowns.append((r["Name"], r.get("Version", "?")))
                  continue
              parts = [p.strip() for p in lic.replace(" OR ", ";").split(";")]
              # Multi-license: accept if any offered license is allowed AND
              # none of the offered ones is hard-banned in isolation.
              if any(p in ALLOWED for p in parts):
                  continue
              # Single-license: check banned tokens only when the *whole*
              # license string is a banned family (avoids false positive
              # when a multi-license offering merely *includes* GPL).
              if any(tok in lic for tok in BANNED) or lic.startswith("GNU General Public License"):
                  violations.append((r["Name"], lic))
                  continue
              violations.append((r["Name"], lic))
          if unknowns:
              print(f"::warning::{len(unknowns)} dependencies report UNKNOWN license (likely a packaging metadata gap):")
              for n, v in unknowns[:10]:
                  print(f"  - {n} {v}")
          if violations:
              print(f"::error::{len(violations)} license allow-list violations:")
              for name, lic in violations:
                  print(f"  - {name}: {lic}")
              sys.exit(1)
          print(f"OK — {len(rows)} dependencies, allow-list clean.")
          PY

      # -- SBOM ------------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-format json \
            --output-file reports/sbom.json

      # -- Trivy: filesystem scan + SPDX SBOM ------------------------------
      - name: Trivy filesystem scan (vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: reports/trivy.sarif
          severity: HIGH,CRITICAL
          # Don't fail on findings — surface them to GitHub Code Scanning;
          # pip-audit (above) is already strict on Python deps.
          exit-code: 0

      - name: Trivy SBOM (SPDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: reports/sbom.spdx

      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: reports/trivy.sarif
          category: trivy

      # -- Artefact --------------------------------------------------------
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-results
          path: |
            reports/vulnerabilities.json
            reports/licenses.csv
            reports/licenses.json
            reports/sbom.json
            reports/sbom.spdx
            reports/trivy.sarif
          retention-days: 30
