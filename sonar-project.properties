sonar.projectKey=helmut-hoffer-von-ankershoffen_ammp-mcp
sonar.organization=helmut-hoffer-von-ankershoffen
sonar.projectName=ammp-mcp
sonar.projectVersion=0.2.0
sonar.projectDescription=Reference implementation of AMMP (Agentic Mentor-Mentee Protocol, draft-ammp-01), Mentoring track, on FastMCP.

sonar.links.homepage=https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp
sonar.links.scm=https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp
sonar.links.ci=https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp/actions
sonar.links.issues=https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp/issues

# Sources live under src/; tests under tests/. We pair this with a
# `[tool.coverage.paths]` block in pyproject.toml that rewrites
# pytest-cov's filenames from `src/ammp_mcp/...` to just `ammp_mcp/...`
# so they resolve against `sonar.sources=src` (otherwise the per-class
# filenames don't match and coverage shows as zero).
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11, 3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

sonar.coverage.exclusions=tests/**, scripts/**, docs/**, dist/**, build/**, **/__main__.py
sonar.exclusions=tests/**, scripts/**, dist/**, build/**, .venv/**, reports/**, .scannerwork/**, mentors/**, docs/**

# ─── Issue suppressions ──────────────────────────────────────────────────
# S1542 (function naming) on server.py: the FastMCP tool functions are
# named after the AMMP operations (`ListPlaybooks`, `GetPlaybook`,
# `SearchPlaybooks`, `AskMentor`, `EscalateToHuman`). PascalCase here
# is *load-bearing* — the function name becomes the over-the-wire MCP
# tool name. Renaming to snake_case would silently break clients.
sonar.issue.ignore.multicriteria=mcp_op_naming
sonar.issue.ignore.multicriteria.mcp_op_naming.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.mcp_op_naming.resourceKey=src/ammp_mcp/server.py
