[project]
name = "ammp"
version = "0.15.4"
description = "🍝 Reference implementation of AMMP — the Agentic Mentor-Mentee Protocol — Mentoring track. Pepe Arturo, exposing his curated playbook corpus to mentee agents (Claude Cowork, Claude.ai, Claude Code, …) over the MCP wire."
readme = "README.md"
authors = [
    { name = "Helmut Hoffer von Ankershoffen", email = "helmuthva@googlemail.com" },
    { name = "Pepe Arturo AI", email = "pepe@helmguild.com" },
]
license = { file = "LICENSE" }

keywords = [
    "ammp",
    "mcp",
    "agentic",
    "mentor",
    "mentee",
    "ietf",
    "internet-draft",
    "fastmcp",
    "claude",
    "anthropic",
    "helmguild",
    "pydantic",
    "pytest",
    "ruff",
    "mypy",
    "typer",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Framework :: Pydantic",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Natural Language :: English",
]

requires-python = ">=3.11, <3.15"

dependencies = [
    "fastmcp[tasks]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "typer>=0.15,<1",
    "rich>=13,<16",
    "anthropic>=0.40,<1",
    "starlette>=0.47,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "pyright>=1.1.400,<2",  # second static type-checker; runs alongside mypy in CI
    "types-PyYAML>=6,<7",  # stubs for the optional yaml import in playbook/_service.py
    "pydoclint>=0.5,<1",   # verifies Args/Returns/Raises match the signature
    "pytest>=9,<10",       # >=9 fixes CVE-2025-71176
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
]

[project.scripts]
ammp = "ammp_mcp.cli:app"

[project.urls]
Homepage = "https://www.helmguild.com/rfc/ammp/"
Repository = "https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp"
Specification = "https://www.helmguild.com/rfc/ammp/draft-ammp-01.txt"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/ammp-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ammp_mcp"]

# ─── Ruff ────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "C90",              # mccabe complexity
    "N",                # pep8-naming
    "ARG",              # unused arguments
    "RUF",              # ruff-specific
    "D",                # pydocstyle (Google convention enforced below)
]
ignore = [
    "E501",   # line length handled by formatter where unavoidable
    "N803",   # MCP operation names are PascalCase per AMMP
    "N802",   # MCP operation function names are PascalCase per AMMP
    "RUF001", # ambiguous unicode in strings — used deliberately in operator-facing prose
    "RUF002", # ambiguous unicode in docstrings — same
    "D203",   # incompatible with D211 — prefer D211 (no blank line before class docstring)
    "D212",   # incompatible with D213 — prefer D213 (multi-line summary on second line)
    "D107",   # __init__ docstrings: we follow Google's "class docstring OR __init__ docstring,
              # not both" convention; pydoclint + tools/check_docstrings.py enforce that the
              # class docstring covers __init__ args. D107 would force a redundant duplicate.
]

[tool.ruff.lint.mccabe]
max-complexity = 44  # FastMCP factories wire many tools; raising over the default 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and scripts: relax docstring requirements (per-test docstrings
# add noise; test names already document intent).
"tests/**/*.py" = ["ARG", "B011", "D"]
"tools/**/*.py" = ["D100", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unreachable = true
exclude = ["build", "dist", ".venv"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── Pyright ─────────────────────────────────────────────────────────────
#
# Second static type-checker alongside mypy. Pyright is faster, catches
# a different set of corner cases (especially around inferred generic
# parameters), and is what most IDEs ship. Run in CI in addition to
# mypy — fail-loud on disagreement.

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "dist", ".venv", "reports"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# ─── Pydoclint ───────────────────────────────────────────────────────────
#
# Verifies that every docstring's Args / Returns / Raises sections match
# the function signature. Pydoclint does NOT check that a docstring
# exists at all — that's `tools/check_docstrings.py`. The two run
# together in CI + pre-commit.

[tool.pydoclint]
style = "google"
# We use the standard `name: description` Google form; types come from
# the function signature, not the docstring.
arg-type-hints-in-docstring = false
# Type-mismatch checks would re-require types in docstrings — skip.
check-return-types = false
check-yield-types = false
# Backend classes document `__init__` args in the class docstring per
# Google convention; pydoclint's class-attribute check would then also
# require an Attributes section listing every `ClassVar`, which is
# noise for our small surface.
check-class-attributes = false

# ─── Pytest ──────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers --cov=ammp_mcp --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage_html"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
markers = [
    "unit: Solitary unit tests — module-in-isolation, deps mocked, offline, <10s.",
    "integration: Sociable integration tests — real I/O across modules (server routes, CLI, file system), still offline (LLM mocked), <10s.",
    "e2e: End-to-end tests with real external services (Claude API, deployed AMMP endpoint). Skipped by default; run with -m e2e.",
]

[tool.coverage.run]
source_pkgs = ["ammp_mcp"]
omit = ["*/tests/*", "*/__main__.py"]

# Alias paths in coverage.xml so SonarCloud's `sonar.sources=src`
# can resolve them. Without this, pytest-cov writes filenames as
# `src/ammp_mcp/server.py` and Sonar (which looks under `src/`) tries
# to match `src/src/ammp_mcp/server.py` and fails — coverage stays 0.
# `source_pkgs = ["ammp_mcp"]` tracks the package by name; the alias
# rewrites the working-tree path to a src-relative one.
[tool.coverage.paths]
source = ["src/ammp_mcp", "*/site-packages/ammp_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
]
